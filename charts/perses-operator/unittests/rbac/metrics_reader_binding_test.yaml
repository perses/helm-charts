suite: metrics-reader ClusterRoleBinding
templates:
  - templates/rbac/metrics-reader-binding.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when prometheus.enable is true but serviceAccount.name is empty
    set:
      prometheus.enable: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when prometheus.enable and serviceAccount.name are set
    set:
      prometheus.enable: true
      prometheus.serviceAccount.name: kps-prometheus
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - isAPIVersion:
          of: rbac.authorization.k8s.io/v1

  - it: should set the correct name
    set:
      prometheus.enable: true
      prometheus.serviceAccount.name: kps-prometheus
    asserts:
      - equal:
          path: metadata.name
          value: test-release-perses-operator-metrics-reader-binding

  - it: should reference the metrics-reader ClusterRole
    set:
      prometheus.enable: true
      prometheus.serviceAccount.name: kps-prometheus
    asserts:
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: test-release-perses-operator-metrics-reader

  - it: should bind to the specified ServiceAccount
    set:
      prometheus.enable: true
      prometheus.serviceAccount.name: kps-prometheus
      prometheus.serviceAccount.namespace: monitoring
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: kps-prometheus
      - equal:
          path: subjects[0].namespace
          value: monitoring

  - it: should default namespace to release namespace when not specified
    set:
      prometheus.enable: true
      prometheus.serviceAccount.name: kps-prometheus
    asserts:
      - equal:
          path: subjects[0].namespace
          value: test-ns
