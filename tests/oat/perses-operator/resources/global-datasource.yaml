apiVersion: perses.dev/v1alpha2
kind: PersesGlobalDatasource
metadata:
  name: oat-global-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: oat
  config:
    display:
      name: OAT global datasource
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        directUrl: http://prometheus.invalid:9090
