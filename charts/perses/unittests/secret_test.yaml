suite: perses environment Secret
templates:
  - templates/config-secret.yaml
  - templates/statefulset.yaml
  - templates/global-admin-bootstrap.yaml
  - templates/config.yaml
  - templates/datasources.yaml
  - templates/helpers/_config.tpl
  - templates/helpers/_identity.tpl
  - templates/NOTES.txt
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should not render a Secret without environment variables
    template: templates/config-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should store environment variables in a Secret and reference them from the workload
    set:
      envVars:
        - name: PERSES_SECURITY_ENCRYPTION_KEY
          value: 0123456789abcdef0123456789abcdef
    asserts:
      - template: templates/config-secret.yaml
        equal:
          path: metadata.name
          value: test-release-perses
      - template: templates/config-secret.yaml
        equal:
          path: data["perses-security-encryption-key"]
          value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - template: templates/statefulset.yaml
        equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: PERSES_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: test-release-perses
                  key: perses-security-encryption-key

  - it: should reference an external Secret when secret.create is disabled
    set:
      secret.create: false
      secret.name: perses-external
      envVars:
        - name: PERSES_SECURITY_ENCRYPTION_KEY
    asserts:
      - template: templates/config-secret.yaml
        hasDocuments:
          count: 0
      - template: templates/statefulset.yaml
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: perses-external

  - it: should reference the deprecated envVarsExternalSecretName
    set:
      envVarsExternalSecretName: perses-legacy
      envVars:
        - name: PERSES_SECURITY_ENCRYPTION_KEY
    asserts:
      - template: templates/config-secret.yaml
        hasDocuments:
          count: 0
      - template: templates/statefulset.yaml
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: perses-legacy

  - it: should generate client credentials variables for OIDC and OAuth providers
    template: templates/config-secret.yaml
    set:
      config.security.enable_auth: true
      config.security.authentication.providers.oidc:
        - slug_id: sso
          client_id: oidc-client
          client_secret: oidc-secret
      config.security.authentication.providers.oauth:
        - slug_id: github
          client_id: oauth-client
          client_secret: oauth-secret
    asserts:
      - equal:
          path: data
          value:
            perses-security-authentication-providers-oidc-0-client-id: b2lkYy1jbGllbnQ=
            perses-security-authentication-providers-oidc-0-client-secret: b2lkYy1zZWNyZXQ=
            perses-security-authentication-providers-oauth-0-client-id: b2F1dGgtY2xpZW50
            perses-security-authentication-providers-oauth-0-client-secret: b2F1dGgtc2VjcmV0

  - it: should not generate client credentials variables when authentication is disabled
    template: templates/config-secret.yaml
    set:
      config.security.authentication.providers.oidc:
        - slug_id: sso
          client_id: oidc-client
          client_secret: oidc-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should bootstrap global admins through a ConfigMap for the sidecar
    template: templates/global-admin-bootstrap.yaml
    set:
      config.security.enable_auth: true
      sidecar.enabled: true
      sidecar.globalAdminUsers:
        - alice
        - bob
    asserts:
      - equal:
          path: metadata.name
          value: test-release-perses-admin-bootstrap
      - equal:
          path: metadata.labels["perses.dev/resource"]
          value: "true"
      - matchRegex:
          path: data["global-admin-binding.yaml"]
          pattern: 'name: "alice"'
      - matchRegex:
          path: data["global-admin-binding.yaml"]
          pattern: 'name: "bob"'

  - it: should not bootstrap global admins when authentication is disabled
    template: templates/global-admin-bootstrap.yaml
    set:
      sidecar.enabled: true
      sidecar.globalAdminUsers:
        - alice
    asserts:
      - hasDocuments:
          count: 0
