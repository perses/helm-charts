suite: perses config secret
templates:
  - templates/config-secret.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should encode the client_id and client_secret of an OIDC provider
    set:
      config.security.enable_auth: true
      config.security.authentication.providers.oidc:
        - slug_id: keycloak
          client_id: perses
          client_secret: secret
    asserts:
      - equal:
          path: data["perses-security-authentication-providers-oidc-0-client-id"]
          value: cGVyc2Vz
      - equal:
          path: data["perses-security-authentication-providers-oidc-0-client-secret"]
          value: c2VjcmV0

  - it: should keep the key of an empty OIDC client_secret as an empty string
    set:
      config.security.enable_auth: true
      config.security.authentication.providers.oidc:
        - slug_id: keycloak
          client_id: perses
          client_secret: ""
    asserts:
      - equal:
          path: data["perses-security-authentication-providers-oidc-0-client-secret"]
          value: ""

  - it: should keep the key of an empty OAuth client_secret as an empty string
    set:
      config.security.enable_auth: true
      config.security.authentication.providers.oauth:
        - slug_id: github
          client_id: perses
    asserts:
      - equal:
          path: data["perses-security-authentication-providers-oauth-0-client-secret"]
          value: ""
