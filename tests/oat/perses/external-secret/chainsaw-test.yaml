apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: perses-external-secret
spec:
  description: With secret.create disabled, Perses reads its environment from a pre-existing Secret.
  catch:
    - events: {}
    - podLogs:
        selector: app.kubernetes.io/name=perses
        tail: 100
  steps:
    - name: create the external Secret
      try:
        - apply:
            file: secret.yaml

    - name: install chart
      try:
        - script:
            content: |
              helm install perses ../../../../charts/perses --namespace "$NAMESPACE" \
                --values values.yaml --wait --timeout 3m
        - script:
            content: helm test perses --namespace "$NAMESPACE" --timeout 3m
      cleanup:
        - script:
            content: helm uninstall perses --namespace "$NAMESPACE" --wait --ignore-not-found

    - name: chart does not create its own Secret
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: perses
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: perses
              spec:
                template:
                  spec:
                    containers:
                      - name: perses
                        env:
                          - name: PERSES_SECURITY_ENCRYPTION_KEY
                            valueFrom:
                              secretKeyRef:
                                name: perses-external
                                key: perses-security-encryption-key
              status:
                readyReplicas: 1

    - name: Perses runs with authentication enabled
      try:
        - script:
            content: |
              kubectl get --raw "/api/v1/namespaces/$NAMESPACE/services/http:perses:http/proxy/api/v1/health"
        - script:
            content: |
              kubectl get --raw "/api/v1/namespaces/$NAMESPACE/services/http:perses:http/proxy/api/v1/projects"
            check:
              ($error != null): true
              (contains($stderr, 'logged in')): true
