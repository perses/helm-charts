{{- if and .Values.prometheus.enable .Values.prometheus.serviceAccount.name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        app.kubernetes.io/component: kube-rbac-proxy
        app.kubernetes.io/created-by: perses-operator
        app.kubernetes.io/instance: metrics-reader-binding
        app.kubernetes.io/name: {{ include "perses-operator.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/part-of: perses-operator
    name: {{ include "perses-operator.resourceName" (dict "suffix" "metrics-reader-binding" "context" $) }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "perses-operator.resourceName" (dict "suffix" "metrics-reader" "context" $) }}
subjects:
    - kind: ServiceAccount
      name: {{ .Values.prometheus.serviceAccount.name }}
      namespace: {{ .Values.prometheus.serviceAccount.namespace | default .Release.Namespace }}
{{- end }}
