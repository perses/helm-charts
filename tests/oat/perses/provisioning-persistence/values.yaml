# Provisioning folder lives on a PersistentVolumeClaim that the sidecar writes to.
provisioningPersistence:
  enabled: true
  size: 1Gi

sidecar:
  enabled: true
  # keep the scenario namespaced so it does not pick up ConfigMaps from other scenarios
  allNamespaces: false

config:
  provisioning:
    interval: 10s
