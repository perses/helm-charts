apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: oat-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: oat
  config:
    display:
      name: OAT datasource
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        directUrl: http://prometheus.invalid:9090
