apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: perses-api-prefix
spec:
  description: With an API prefix configured, probes, metrics and the API are served below the prefix.
  catch:
    - events: {}
    - podLogs:
        selector: app.kubernetes.io/name=perses
        tail: 100
  steps:
    - name: install chart
      try:
        - script:
            content: |
              helm install perses ../../../../charts/perses --namespace "$NAMESPACE" \
                --values values.yaml --wait --timeout 3m
        - script:
            content: helm test perses --namespace "$NAMESPACE" --timeout 3m
      cleanup:
        - script:
            content: helm uninstall perses --namespace "$NAMESPACE" --wait --ignore-not-found

    - name: probes and metrics follow the prefix
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: perses
              spec:
                template:
                  spec:
                    containers:
                      - name: perses
                        readinessProbe:
                          httpGet:
                            path: /perses/api/v1/health
                        livenessProbe:
                          httpGet:
                            path: /perses/api/v1/health
              status:
                readyReplicas: 1
        - script:
            content: |
              kubectl get --raw "/api/v1/namespaces/$NAMESPACE/services/http:perses:http/proxy/perses/metrics"
            check:
              (contains($stdout, 'perses_')): true

    - name: API answers below the prefix
      try:
        - script:
            content: |
              kubectl get --raw "/api/v1/namespaces/$NAMESPACE/services/http:perses:http/proxy/perses/api/v1/health"
              kubectl get --raw "/api/v1/namespaces/$NAMESPACE/services/http:perses:http/proxy/perses/api/v1/projects"
